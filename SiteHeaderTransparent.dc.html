<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:68}}">
class Component extends DCLogic {
  state = { menu: null, mobileOpen: false };
  renderVals() {
    const m = this.state.menu;
    const on = key => ({
      ['trigger' + key + 'Color']: m === key ? '#F7F3ED' : 'rgba(247,243,237,.75)',
      ['trigger' + key + 'Rule']: m === key ? 'currentColor' : 'transparent',
      ['panel' + key + 'Opacity']: m === key ? 1 : 0,
      ['panel' + key + 'Transform']: m === key ? 'translateY(0)' : 'translateY(-8px)',
      ['panel' + key + 'Visibility']: m === key ? 'visible' : 'hidden',
      ['panel' + key + 'Pointer']: m === key ? 'auto' : 'none'
    });
    return Object.assign({}, on('Ministries'), on('Church'), on('About'), {
      openMinistries: () => this.setState({ menu: 'Ministries' }),
      openChurch: () => this.setState({ menu: 'Church' }),
      openAbout: () => this.setState({ menu: 'About' }),
      closeMenu: () => this.setState({ menu: null }),
      mobilePanelDisplay: this.state.mobileOpen ? 'block' : 'none',
      mobileExpanded: this.state.mobileOpen ? 'true' : 'false',
      ministriesExpanded: m === 'Ministries' ? 'true' : 'false',
      churchExpanded: m === 'Church' ? 'true' : 'false',
      aboutExpanded: m === 'About' ? 'true' : 'false',
      toggleMobile: () => this.setState(s => ({ mobileOpen: !s.mobileOpen })),
      toggleMinistries: () => this.setState(s => ({ menu: s.menu === 'Ministries' ? null : 'Ministries' })),
      toggleChurch: () => this.setState(s => ({ menu: s.menu === 'Church' ? null : 'Church' })),
      toggleAbout: () => this.setState(s => ({ menu: s.menu === 'About' ? null : 'About' }))
    });
  }
}
</script>
